# Fork-only: build and publish ghcr.io/<owner>/obsidian-mcp on every push to
# main, without running the test suite first.
#
# Upstream's ci.yml (full suite) and image.yml (publishes only after CI
# passes, to upstream's own package) are disabled in this fork's Actions
# settings rather than edited, so syncing with upstream never conflicts here.
# Run the suite locally, or through a pull request to upstream, before relying
# on a change.
name: fork-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for the container image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main is what the server follows with AutoUpdate=registry;
          # sha-<short> keeps every build addressable for a rollback.
          tags: |
            type=raw,value=main
            type=sha

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
